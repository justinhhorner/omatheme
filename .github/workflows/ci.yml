# Builds and tests every client: on pushes to main, on pull requests, and as the first step of a
# release (release.yml calls this with the tag to test).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'design/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'design/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an older run pointless; a release's run is never cancelled.
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Use the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release.candidate|_rc' | sort -V | tail -1)"
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
      - name: Test OmarchyThemesKit
        working-directory: macos/OmarchyThemesKit
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project OmarchyThemes.xcodeproj -scheme OmarchyThemes -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData build

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build OmarchyThemes.sln
      - name: Test
        run: dotnet test OmarchyThemes.sln --no-build

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
