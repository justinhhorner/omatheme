<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Omarchy Themes app icon: a tiling-window layout in a Tokyo Night–style palette.
       Source of truth for both platforms; Windows raster assets are generated by
       windows/tools/Generate-AppIcon.ps1 using the same geometry. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#13141c"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="192" y="192" width="296" height="640" rx="56" fill="#7aa2f7"/>
  <rect x="536" y="192" width="296" height="296" rx="56" fill="#bb9af7"/>
  <rect x="536" y="536" width="296" height="296" rx="56" fill="#9ece6a"/>
</svg>
