[package]
name = "omatheme"
version = "0.1.0"
edition = "2024"
description = "Omarchy Themes for the command line: browse the Omarchy theme gallery and apply a theme on macOS and Windows"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["webp", "bmp", "png"] }
indicatif = "0.18.6"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

# TLS: the OS's own stack on macOS and Windows (Security.framework, SChannel), so nothing has to be
# compiled from C for those targets; rustls elsewhere.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSData", "NSDictionary", "NSError", "NSKeyedArchiver", "NSString", "NSURL", "NSUserDefaults", "NSValue", "NSObject", "NSCoder", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSWorkspace", "NSScreen", "NSColor", "NSColorSpace", "NSGraphics", "NSCell"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = "thin"
